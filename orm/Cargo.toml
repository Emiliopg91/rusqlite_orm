[package]
name = "rusqlite_orm"
version = "0.4.0"
edition = "2024"
description = "ORM for rusqlite"
repository = "https://github.com/Emiliopg91/rusqlite_orm/orm"
readme = "README.md"
license = "MIT"
categories = ["database"]

[dependencies]
rusqlite = { version = "^0", feature = ["bundled"] }
thiserror = "^2"
log = "^0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
