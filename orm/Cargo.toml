[package]
name = "rusqlite_orm"
version = "0.4.12"
edition = "2024"
description = "ORM for rusqlite"
repository = "https://github.com/Emiliopg91/rusqlite_orm/orm"
readme = "README.md"
license = "MIT"
categories = ["database"]

[dependencies]
r2d2 = "0"
r2d2_sqlite = { version = "0", features = ["bundled"] }
thiserror = "2"
log = "0"

[dev-dependencies]
tempfile = "^3"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
