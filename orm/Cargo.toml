[package]
name = "rusqlite_orm"
version = "3.4.0"
edition = "2024"
description = "ORM for rusqlite"
repository = "https://github.com/Emiliopg91/rusqlite_orm/orm"
readme = "README.md"
license = "MIT"
categories = ["database"]

[dependencies]
r2d2 = "0"
r2d2_sqlite = "0.37"
# Not used directly: enables `Connection::limit`, to size multi-row INSERT batches. Must match the
# rusqlite version r2d2_sqlite depends on (it is re-exported from there), or Cargo resolves a
# separate copy and the feature never reaches the re-exported crate.
rusqlite = { version = "0.42", features = ["limits"] }
thiserror = "2"
log = "0"
serde = "1.0.229"
rusqlite_orm_macros = { version = "3.4", path = "../macros", optional = true }
blocking = "1"
futures-lite = "2"

[features]
default = ["bundled"]
# Compiles SQLite from source into the binary. Disable it (`default-features = false`)
# to link against the system `libsqlite3` instead.
bundled = ["r2d2_sqlite/bundled"]
derive = ["dep:rusqlite_orm_macros"]
# Copying databases in memory: `DatabasePool::serialize` and the in-memory builder's `contents`.
serialize = ["rusqlite/serialize"]

[dev-dependencies]
pollster = "1"
tempfile = "^3"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
